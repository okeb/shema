<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#F8F9FA" opacity="0.5"/>
  
  <!-- Bible book -->
  <g transform="translate(80, 80)">
    <!-- Book shadow -->
    <rect x="10" y="245" width="230" height="15" rx="2" fill="#000" opacity="0.1"/>
    
    <!-- Book base -->
    <rect x="20" y="20" width="200" height="240" rx="8" fill="#8B4513"/>
    
    <!-- Book pages -->
    <rect x="30" y="30" width="180" height="220" rx="4" fill="#FFFEF7"/>
    
    <!-- Cross on cover -->
    <g transform="translate(110, 130)">
      <rect x="-5" y="-30" width="10" height="60" rx="2" fill="#D4AF37"/>
      <rect x="-20" y="-5" width="40" height="10" rx="2" fill="#D4AF37"/>
    </g>
    
    <!-- Book title -->
    <text x="110" y="100" font-family="serif" font-size="18" font-weight="bold" fill="#D4AF37" text-anchor="middle">
      BIBLE
    </text>
    
    <!-- Decorative lines on pages -->
    <line x1="45" y1="60" x2="195" y2="60" stroke="#D3D3D3" stroke-width="2"/>
    <line x1="45" y1="75" x2="195" y2="75" stroke="#D3D3D3" stroke-width="2"/>
    <line x1="45" y1="90" x2="180" y2="90" stroke="#D3D3D3" stroke-width="2"/>
    
    <line x1="45" y1="180" x2="195" y2="180" stroke="#D3D3D3" stroke-width="2"/>
    <line x1="45" y1="195" x2="195" y2="195" stroke="#D3D3D3" stroke-width="2"/>
    <line x1="45" y1="210" x2="170" y2="210" stroke="#D3D3D3" stroke-width="2"/>
    <line x1="45" y1="225" x2="195" y2="225" stroke="#D3D3D3" stroke-width="2"/>
    
    <!-- Page edge detail -->
    <rect x="218" y="25" width="4" height="230" rx="1" fill="#EAEAEA"/>
    <rect x="222" y="27" width="3" height="226" rx="1" fill="#D3D3D3"/>
  </g>
  
  <!-- Floating verses (decorative) -->
  <g opacity="0.3">
    <text x="50" y="60" font-family="serif" font-size="14" fill="#8B4513" style="font-style: italic;">Jean 3:16</text>
    <text x="280" y="100" font-family="serif" font-size="14" fill="#8B4513" style="font-style: italic;">Ps. 23:1</text>
    <text x="320" y="320" font-family="serif" font-size="14" fill="#8B4513" style="font-style: italic;">Gen. 1:1</text>
    <text x="40" y="340" font-family="serif" font-size="14" fill="#8B4513" style="font-style: italic;">Ap. 22:21</text>
  </g>
  
  <!-- Light rays -->
  <g opacity="0.2">
    <path d="M 200 50 L 220 10 L 240 50 Z" fill="#FFD700"/>
    <path d="M 200 50 L 200 10 L 210 50 Z" fill="#FFD700"/>
    <path d="M 200 50 L 180 10 L 190 50 Z" fill="#FFD700"/>
  </g>
</svg>
