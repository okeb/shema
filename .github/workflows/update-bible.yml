name: Mise à jour Bible BJC

on:
  workflow_dispatch:  # déclenché par la cron Vercel ou manuellement

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # autorise le commit/push des JSON régénérés

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exécution du script de mise à jour
        run: python3 scripts/update_from_gitlab.py

      - name: Commit et push des fichiers mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/thebym.json db/books/bym_info.json  # bym_info.json suivi (utilisé par index.js pour titre/paragraphe) ; bym.json reste gitignored
          # Ne commit que s'il y a des changements
          git diff --cached --quiet && echo "Aucun changement détecté" || \
            git commit -m "chore: mise à jour Bible BJC depuis GitLab [automated]"
          git push
