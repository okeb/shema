name: Mise à jour Bible BJC

on:
  workflow_dispatch:  # déclenché par la cron Vercel ou manuellement

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mise à jour des textes depuis GitLab
        run: python3 scripts/update_from_gitlab.py

      - name: Alignement Strong's (make align)
        run: make align

      - name: Vérification d'intégrité des overrides
        # Refuse de commettre si une override est stale : le texte BYM a changé
        # (depuis GitLab) mais l'override n'a pas été re-curaté. Évite de pousser
        # un alignement cassé en production. La re-curation reste manuelle.
        run: python3 scripts/check_override_integrity.py

      - name: Commit et push des fichiers mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            db/thebym.json \
            db/books/bym.json \
            db/books/bym_info.json \
            db/strongs/bym_strongs.json \
            db/strongs/strong_to_bym.json \
            db/strongs/strong_index.json \
            db/strongs/versif_offsets.json \
            db/strongs/occurrences.json \
            db/strongs/gloss_mapping.json \
            db/strongs/overrides.json \
            db/strongs/manual_variants.json
          git diff --cached --quiet && echo "Aucun changement détecté" || \
            git commit -m "chore: mise à jour Bible BJC + alignement Strong's [automated]"
          git push